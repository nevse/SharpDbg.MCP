name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dotnet-version: ['10.0.x']

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    # Integration tests attach a real ICorDebug debugger to a child process, which hosted
    # runners do not reliably permit. Run them locally with ./scripts/test-integration.sh
    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal --filter "TestCategory!=Integration" --logger "trx;LogFileName=test-results.trx"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.os }}
        path: '**/test-results.trx'

  integration-tests:
    name: Integration Tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # Report every platform; attach permissions differ per runner
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Show ptrace scope
      if: runner.os == 'Linux'
      run: cat /proc/sys/kernel/yama/ptrace_scope

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Integration tests
      run: dotnet test --no-build --configuration Release --filter "TestCategory=Integration" --verbosity normal

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    # Both checks are allowed to fail so that every one of them runs and reports its
    # findings; the gate below turns the collected results into the job status.
    - name: Check format
      id: format
      run: dotnet format --verify-no-changes --verbosity diagnostic
      continue-on-error: true

    - name: Run code analysis
      id: analysis
      run: dotnet build --no-restore /p:TreatWarningsAsErrors=true
      continue-on-error: true

    - name: Code quality gate
      if: always()
      env:
        FORMAT_OUTCOME: ${{ steps.format.outcome }}
        ANALYSIS_OUTCOME: ${{ steps.analysis.outcome }}
      run: |
        status=0
        if [ "$FORMAT_OUTCOME" != "success" ]; then
          echo "::error title=Format::dotnet format reported violations (see the Check format step)"
          status=1
        fi
        if [ "$ANALYSIS_OUTCOME" != "success" ]; then
          echo "::error title=Analysis::Code analysis reported warnings as errors (see the Run code analysis step)"
          status=1
        fi
        if [ "$status" -eq 0 ]; then
          echo "All code quality checks passed."
        fi
        exit "$status"

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: github.event_name == 'release'

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Release
      run: dotnet build --configuration Release --no-restore

    - name: Publish Linux x64
      run: dotnet publish src/SharpDbg.MCP/SharpDbg.MCP.csproj --configuration Release --runtime linux-x64 --self-contained false --output ./publish/linux-x64

    - name: Publish Windows x64
      run: dotnet publish src/SharpDbg.MCP/SharpDbg.MCP.csproj --configuration Release --runtime win-x64 --self-contained false --output ./publish/win-x64

    - name: Publish macOS x64
      run: dotnet publish src/SharpDbg.MCP/SharpDbg.MCP.csproj --configuration Release --runtime osx-x64 --self-contained false --output ./publish/osx-x64

    - name: Publish macOS ARM64
      run: dotnet publish src/SharpDbg.MCP/SharpDbg.MCP.csproj --configuration Release --runtime osx-arm64 --self-contained false --output ./publish/osx-arm64

    - name: Create archives
      run: |
        cd publish
        tar -czf ../sharpdbg-mcp-linux-x64.tar.gz -C linux-x64 .
        zip -r ../sharpdbg-mcp-win-x64.zip win-x64/*
        tar -czf ../sharpdbg-mcp-osx-x64.tar.gz -C osx-x64 .
        tar -czf ../sharpdbg-mcp-osx-arm64.tar.gz -C osx-arm64 .

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v3
      with:
        files: |
          sharpdbg-mcp-linux-x64.tar.gz
          sharpdbg-mcp-win-x64.zip
          sharpdbg-mcp-osx-x64.tar.gz
          sharpdbg-mcp-osx-arm64.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
