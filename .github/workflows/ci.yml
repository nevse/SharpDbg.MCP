name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dotnet-version: ['10.0.x']

    steps:
    - uses: actions/checkout@v7
      # The debugger is a submodule and the build compiles it, so a shallow checkout of this
      # repository alone cannot build anything
      with:
        submodules: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    # Integration tests run in their own job so they are not executed twice
    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal --filter "TestCategory!=Integration" --logger "trx;LogFileName=test-results.trx"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.os }}
        path: '**/test-results.trx'

  integration-tests:
    name: Integration Tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One platform failing should not hide the others
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v7
      # The debugger is a submodule and the build compiles it, so a shallow checkout of this
      # repository alone cannot build anything
      with:
        submodules: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    # The test host is killed by a segfault inside libmscordbi while it replays the events for an
    # attach in roughly a fifth of macOS runs, and the integration tests attach around thirty times
    # each. Only that crash is retried: a test that merely fails is a result we want to see, so it
    # ends the job on the first attempt. At a fifth per attempt, three attempts leave under a percent
    # of runs red for a reason that is not ours.
    - name: Integration tests
      shell: bash
      run: |
        set -o pipefail
        attempt=1
        attempts=3

        while true; do
          log="integration-attempt-$attempt.log"

          if dotnet test --no-build --configuration Release --filter "TestCategory=Integration" --verbosity normal 2>&1 | tee "$log"; then
            exit 0
          fi

          # A host-level abort leaves no failing test behind, which is how it is told apart from one
          if grep -qE "Test host process crashed|Test Run Aborted" "$log" && [ "$attempt" -lt "$attempts" ]; then
            echo "::warning title=Test host crashed::Attempt $attempt of $attempts died in the debugger shim, retrying"
            attempt=$((attempt + 1))
            continue
          fi

          exit 1
        done

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      # The debugger is a submodule and the build compiles it, so a shallow checkout of this
      # repository alone cannot build anything
      with:
        submodules: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    # Both checks are allowed to fail so that every one of them runs and reports its
    # findings; the gate below turns the collected results into the job status.
    - name: Check format
      id: format
      run: dotnet format --verify-no-changes --verbosity diagnostic
      continue-on-error: true

    - name: Run code analysis
      id: analysis
      run: dotnet build --no-restore /p:TreatWarningsAsErrors=true
      continue-on-error: true

    - name: Code quality gate
      if: always()
      env:
        FORMAT_OUTCOME: ${{ steps.format.outcome }}
        ANALYSIS_OUTCOME: ${{ steps.analysis.outcome }}
      run: |
        status=0
        if [ "$FORMAT_OUTCOME" != "success" ]; then
          echo "::error title=Format::dotnet format reported violations (see the Check format step)"
          status=1
        fi
        if [ "$ANALYSIS_OUTCOME" != "success" ]; then
          echo "::error title=Analysis::Code analysis reported warnings as errors (see the Run code analysis step)"
          status=1
        fi
        if [ "$status" -eq 0 ]; then
          echo "All code quality checks passed."
        fi
        exit "$status"

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [build-and-test, integration-tests]
    if: github.event_name == 'release'

    outputs:
      version: ${{ steps.version.outputs.value }}

    # Naming any permission drops the defaults for this job, so contents has to be restated for the
    # release upload below
    permissions:
      id-token: write   # let GitHub mint the OIDC token nuget.org trades for a short-lived key
      contents: write   # attach the package to the release

    steps:
    - uses: actions/checkout@v7
      # The debugger is a submodule and the build compiles it, so a shallow checkout of this
      # repository alone cannot build anything
      with:
        submodules: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    # The release tag is the only place a version is written. One RID-agnostic package covers every
    # platform, because the native shim ships all of them, so there is nothing per-platform to build.
    - name: Read the version from the tag
      id: version
      run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    # NuGet.org reads this manifest to generate client configuration, and the MCP Registry matches
    # its version against the published package
    - name: Stamp the version into server.json
      run: |
        python3 - <<'PY'
        import json, os, pathlib
        version = os.environ["VERSION"]
        path = pathlib.Path("src/SharpDbg.MCP/.mcp/server.json")
        manifest = json.loads(path.read_text())
        manifest["version"] = version
        for package in manifest["packages"]:
            package["version"] = version
        path.write_text(json.dumps(manifest, indent=2) + "\n")
        PY
      env:
        VERSION: ${{ steps.version.outputs.value }}

    # The registry job publishes this exact file, so what the registry advertises and what nuget
    # holds cannot drift apart
    - name: Keep the stamped manifest for the registry job
      uses: actions/upload-artifact@v4
      with:
        name: mcp-manifest
        path: src/SharpDbg.MCP/.mcp/server.json

    - name: Pack
      run: >
        dotnet pack src/SharpDbg.MCP/SharpDbg.MCP.csproj
        --configuration Release
        -p:Version=${{ steps.version.outputs.value }}
        --output ./artifacts

    # Trusted publishing: nuget.org validates the workflow's OIDC token against a policy naming this
    # owner, repository and workflow file, then issues an API key that lives an hour. No long-lived
    # secret is stored here. The key is requested immediately before the push on purpose.
    - name: Exchange the OIDC token for a NuGet key
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push to NuGet.org
      run: >
        dotnet nuget push ./artifacts/*.nupkg
        --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        --source https://api.nuget.org/v3/index.json
        --skip-duplicate

    - name: Attach the package to the release
      uses: softprops/action-gh-release@v3
      with:
        files: ./artifacts/*.nupkg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The registry entry is a second publication: nothing about pushing to nuget.org updates it, and a
  # hand publish for 0.1.0 was still advertising that version after 0.1.1 shipped. It waits for
  # nuget to finish validating the push, so it runs after the package rather than beside it - as its
  # own workflow it spent part of its 30-minute budget on the build ahead of it, and the 0.2.0 run
  # was cancelled on that timeout while the README was still on its way.
  registry:
    name: MCP Registry
    runs-on: ubuntu-latest
    needs: [package]
    timeout-minutes: 25

    permissions:
      # The registry authenticates the io.github.nevse namespace from this token. No secret is
      # stored: the same OIDC exchange the NuGet push already relies on.
      id-token: write

    steps:
    # No checkout: the only file this needs is the manifest the package job stamped and shipped
    - uses: actions/download-artifact@v4
      with:
        name: mcp-manifest

    # The registry proves we own the name by reading the mcp-name marker out of the package README on
    # nuget.org, so there is nothing for it to verify until nuget has finished validating the push.
    # That took several minutes for 0.1.1.
    - name: Wait for nuget.org to serve the package README
      env:
        VERSION: ${{ needs.package.outputs.version }}
      run: |
        url="https://api.nuget.org/v3-flatcontainer/dotnetdebugger.mcp/${VERSION}/readme"

        for attempt in $(seq 1 40); do
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$url" || echo 000)

          if [ "$code" = "200" ]; then
            echo "Served after $attempt attempt(s)"
            exit 0
          fi

          echo "attempt $attempt: HTTP $code"
          sleep 30
        done

        echo "::error::$url never became available, so the registry cannot verify the package"
        exit 1

    # Always the latest binary on purpose: an older one fails against the current registry with
    # "invalid audience", which reads like an authentication problem rather than a stale tool.
    - name: Install mcp-publisher
      run: |
        os=$(uname -s | tr '[:upper:]' '[:lower:]')
        arch=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')

        curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${os}_${arch}.tar.gz" \
          | tar xz mcp-publisher

    - name: Authenticate
      run: ./mcp-publisher login github-oidc

    - name: Publish
      run: ./mcp-publisher publish server.json

    - name: Report what the registry now holds
      if: always()
      run: |
        curl -s "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.nevse" \
          | python3 -m json.tool
